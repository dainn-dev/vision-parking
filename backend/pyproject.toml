[project]
name = "vision-parking-backend"
version = "0.1.0"
description = "Multi-tenant vehicle access & barrier-gate governance backend (FastAPI + PostgreSQL + MQTT)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.16.2",
    "pydantic[email]==2.11.7",
    "pydantic-settings==2.10.1",
    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "pyotp==2.9.0",
    "cryptography==45.0.5",
    "aiomqtt==2.3.0",
    "redis[hiredis]==5.3.1",
    "arq==0.26.3",
    "minio==7.2.15",
    "aiosmtplib==3.0.2",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "httpx==0.28.1",
    "ruff==0.12.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
